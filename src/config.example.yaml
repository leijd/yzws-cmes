mode: center

# 二维码扫码地址前缀（一般为 Web 端访问地址，例如 http://192.168.1.10:18379）。
# 留空时按请求的 Origin/Referer/Host 自动推导。
public_base_url: ""

server:
  listen: ":18370"
  read_header_timeout_ms: 10000

node:
  id: center-local

storage:
  attachment_dir: data/attachments

security:
  access_token_minutes: 120
  offline_session_hours: 168

# 数据端：复制本文件为 config.yaml 后填写真实连接信息（config.yaml 已被 .gitignore 排除）
# 未配置 databases.secure 时保持单库行为（plain_only + 从明文库读取），旧部署零改动可跑。
database:
  host: 127.0.0.1
  port: 5432
  name: yzws-v1
  user: postgres
  password: "CHANGE_ME"
  sslmode: disable
  max_conns: 20

# ===== 双数据库与加密（设计文档第 3 章）=====
